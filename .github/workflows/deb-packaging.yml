name: Experimental Debian packages
on:
  push:
    branches: [deb-packaging]
    paths: ['packaging/**', 'rpi/**', '.github/workflows/deb-packaging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cpu: ''
            label: amd64
          - runner: ubuntu-24.04-arm
            cpu: ''
            label: arm64
          - runner: ubuntu-24.04-arm
            cpu: cortex-a72
            label: pi4
          - runner: ubuntu-24.04-arm
            cpu: cortex-a76
            label: pi5
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates build-essential cmake libasound2-dev python3 dpkg-dev
      - uses: actions/checkout@v4
      - name: Build and validate
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash packaging/build-deb.sh "0.1.0~preview${GITHUB_RUN_NUMBER}" "$CPU"
      - name: Package smoke test
        run: |
          apt-get install -y ./dist/*.deb
          /usr/lib/rpi-ton3k/build-rpi/rpit3k --bypass --verify
          python3 /usr/lib/rpi-ton3k/rpi/server.py --help
          test -d /var/lib/rpi-ton3k
          touch /var/lib/rpi-ton3k/ci-marker
          apt-get install -y --reinstall ./dist/*.deb
          test -f /var/lib/rpi-ton3k/ci-marker
          apt-get remove -y rpi-ton3k
          test -f /var/lib/rpi-ton3k/ci-marker
      - uses: actions/upload-artifact@v4
        with:
          name: rpi-ton3k-${{ matrix.label }}
          path: dist/*.deb
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/deb-packaging'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpi-ton3k-*
          path: release
          merge-multiple: true
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="deb-preview-${GITHUB_RUN_NUMBER}"
          cd release
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 4
          sha256sum *.deb > SHA256SUMS
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" *.deb SHA256SUMS --clobber
          else
            gh release create "$tag" *.deb SHA256SUMS --target "$GITHUB_SHA" --prerelease --latest=false --title "RPi-Ton3K Debian preview ${GITHUB_RUN_NUMBER}" --notes "Experimental packages for Debian 13 / Raspberry Pi OS Trixie 64-bit. All CI build and smoke tests passed. Physical ALSA/Pisound and systemd operation on real hardware remain unverified. Install only the matching CPU variant on a spare system. Pisound drivers must already be installed. See the deb-packaging branch for configuration and migration instructions."
          fi
