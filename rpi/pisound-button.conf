# Ton3K autonomous Pisound mappings; installed into /etc/pisound.conf.
CLICK_1 /usr/local/bin/rpit3k-button-stomp
CLICK_2 /usr/local/bin/rpit3k-button-next
CLICK_3 /usr/local/bin/rpit3k-button-hotspot
HOLD_1S /usr/local/bin/rpit3k-button-identify
HOLD_3S /usr/local/bin/rpit3k-button-audio
HOLD_5S /usr/local/bin/rpit3k-button-shutdown
