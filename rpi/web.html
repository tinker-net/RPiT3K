<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPiT3K</title><style>
:root{color-scheme:dark;font:16px system-ui;color:#e8e5df;background:#151617}*{box-sizing:border-box}body{max-width:820px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:.06em;margin-bottom:0}small{color:#aaa}section{background:#202224;border:1px solid #36393c;border-radius:12px;padding:20px;margin:16px 0}h2{font-size:16px;text-transform:uppercase;letter-spacing:.09em;margin-top:0;color:#d7ad77}button,select,input{font:inherit}button,select{padding:10px;border:1px solid #555;border-radius:7px;background:#303234;color:inherit}button{cursor:pointer}button.primary{background:#d7ad77;color:#161616;border:0;font-weight:bold}button.selected{border:2px solid #d7ad77}button:disabled{opacity:.5;cursor:wait}label{display:block;margin:12px 0}select{width:100%}input[type=range]{width:100%;accent-color:#d7ad77}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}.controls label{margin:0}output{float:right;color:#d7ad77}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#bbb;max-height:180px;overflow:auto}#message{min-height:1.5em;color:#d7ad77}#status{font-size:13px}input[type=file]{max-width:100%}
</style></head><body>
<header><div><h1>RPiT3K</h1><small>Raspberry Pi 5 · Pisound · 48 kHz / 64 frames</small></div><span id="status">Connecting…</span></header>
<section><h2>Presets</h2><div class="row" id="slots"></div></section>
<section><h2>Signal chain</h2>
<label>Block 1 — NAM<select id="model"></select></label>
<label>Model size<select id="slim"><option value="1">Full / maximum</option><option value="0">Lite / minimum (slimmable only)</option></select></label>
<label>Block 2 — NAM or cabinet IR<select id="second"></select></label>
<label>Second model size<select id="slim2"><option value="1">Full / maximum</option><option value="0">Lite / minimum (slimmable only)</option></select></label>
<label><input type="checkbox" id="bypass"> Bypass NAM and IR</label>
</section>
<section><h2>Controls</h2><div class="controls" id="controls"></div></section>
<section><h2>Local library</h2><input type="file" id="upload" accept=".nam,.wav" multiple><button id="uploadBtn">Import files</button><p><small>Mono NAM and WAV. Files stay on the Raspberry Pi.</small></p></section>
<div class="row"><button id="save">Save preset</button><button id="apply" class="primary">Apply / start audio</button><button id="stop">Stop audio</button></div>
<p id="message" role="status"></p><section><h2>Engine status</h2><pre id="logs"></pre><small>Applying a preset restarts the audio engine. Seamless switching and live knobs are not implemented yet.</small></section>
<script>
const el=id=>document.getElementById(id);
const ranges={input:[0,2,.01],output:[0,1,.01],bass:[-20,20,1],mid:[-15,15,1],treble:[-10,10,1]};
let state,slot="1",busy=false;
for(const [key,[min,max,step]] of Object.entries(ranges)){
 const label=document.createElement("label"),out=document.createElement("output"),input=document.createElement("input");
 label.append(key.toUpperCase(),out,input);out.id=key+"Value";input.type="range";input.id=key;input.min=min;input.max=max;input.step=step;
 input.oninput=()=>out.textContent=input.value;el("controls").append(label);
}
async function request(path,body){
 const opts=body===undefined?{}:{method:"POST",headers:{"X-RPiT3K":"1"},body};
 const res=await fetch(path,opts);const data=await res.json();if(!res.ok)throw Error(data.error||res.status);return data;
}
function options(id,files,value){const s=el(id);s.replaceChildren(new Option("None",""));for(const f of files)s.add(new Option(f,f));s.value=value||"";}
function render(preset){
 options("model",state.files.filter(f=>f.toLowerCase().endsWith(".nam")),preset.model);
 options("second",state.files,preset.second);
 for(const k of ["slim","slim2",...Object.keys(ranges)]){el(k).value=preset[k];if(el(k+"Value"))el(k+"Value").textContent=preset[k];}
 el("bypass").checked=preset.bypass;
}
function read(){const p={model:el("model").value,second:el("second").value,bypass:el("bypass").checked};
 for(const k of ["slim","slim2",...Object.keys(ranges)])p[k]=Number(el(k).value);return p;}
function status(){
 el("status").textContent=state.running?"Audio running · preset "+state.active:"Audio stopped";
 el("logs").textContent=state.logs.join("\n");
 el("slots").replaceChildren();
 for(const k of Object.keys(state.presets)){const b=document.createElement("button");b.textContent="Preset "+k+(state.running&&state.active===k?" •":"");b.className=k===slot?"selected":"";b.disabled=busy;b.onclick=()=>{slot=k;render(state.presets[k]);status()};el("slots").append(b);}
}
async function action(fn){if(busy)return;busy=true;for(const id of ["save","apply","stop","uploadBtn"])el(id).disabled=true;
 el("message").textContent="Working…";try{await fn();el("message").textContent="Done";}catch(e){el("message").textContent=e.message;}
 finally{busy=false;for(const id of ["save","apply","stop","uploadBtn"])el(id).disabled=false;status();}}
el("save").onclick=()=>action(async()=>{state=await request("/api/save",JSON.stringify({slot,preset:read()}));});
el("apply").onclick=()=>action(async()=>{state=await request("/api/apply",JSON.stringify({slot,preset:read()}));});
el("stop").onclick=()=>action(async()=>{state=await request("/api/stop","");});
el("uploadBtn").onclick=()=>action(async()=>{const p=read();for(const f of el("upload").files){state=await request("/api/upload?name="+encodeURIComponent(f.name),f);}render(p);el("upload").value="";});
(async()=>{try{state=await request("/api/status");render(state.presets[slot]);status();setInterval(async()=>{if(!busy){try{const s=await request("/api/status");if(!busy){state=s;status();}}catch(e){el("status").textContent="Disconnected";}}},2000);}catch(e){el("message").textContent=e.message;}})();
</script></body></html>
