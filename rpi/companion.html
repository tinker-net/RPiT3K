<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RPi-Ton3K Companion</title>
<style>*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font:15px Arial,sans-serif}header{padding:20px 5%;border-bottom:1px solid #333;display:flex;gap:20px;align-items:center}a{color:#ddd}main{max-width:1100px;margin:32px auto;padding:0 18px;display:grid;grid-template-columns:2fr 1fr;gap:20px}section{background:#151517;border:1px solid #39393e;border-radius:14px;padding:22px}h2{font:14px monospace;color:#aaa;margin:0 0 24px}button,select,input{font:inherit;color:#eee;background:#222226;border:1px solid #555;border-radius:7px;padding:10px;min-width:0}button{cursor:pointer}button:disabled{opacity:.5}button.active{border-color:#ff0;color:#ff0}.slots{display:flex;gap:8px;margin-bottom:20px}.slots button{flex:1}.chain{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}.tile{border:1px dashed #777;border-radius:12px;min-height:180px;padding:15px;display:flex;flex-direction:column;justify-content:center;gap:10px}.tile select{width:100%}label{display:block;color:#aaa;font-size:12px;margin-bottom:6px}section>button{display:block;width:100%;margin:10px 0;border-radius:25px}#message{white-space:pre-wrap;color:#ddd;line-height:1.4}small{color:#aaa}#cloudId{width:100%;margin:8px 0}@media(max-width:700px){main{grid-template-columns:1fr}.chain{grid-template-columns:1fr}.arrow{display:none}}</style></head>
<body><header><strong>RPi-Ton3K · COMPANION</strong><a href="/">Main interface</a></header><main><section><h2 id="title">PRESET 1</h2><div class="slots" id="slots"></div><div class="chain"><div class="tile"><label for="model">NAM 1</label><select id="model"></select><label for="slim">Quality</label><select id="slim"><option value="1">Full</option><option value="0">Lite</option></select></div><span class="arrow">→</span><div class="tile"><label for="second">NAM 2 / IR</label><select id="second"></select><label for="slim2">Quality</label><select id="slim2"><option value="1">Full</option><option value="0">Lite</option></select></div></div><p><label for="ir">Cabinet IR A</label><select id="ir"></select></p><p><label for="ir2">Cabinet IR B</label><select id="ir2"></select></p><label><input type="checkbox" id="bypass"> Bypass</label><small>Other DSP parameters remain unchanged.</small></section><section><h2>PEDAL · 4 SLOTS</h2><button id="sync">Sync from pedal</button><button id="save">Save changed presets</button><hr><h2>TONE3000 IMPORT</h2><small>Connect to TONE3000 in the main interface first. Enter a numeric model ID, not a tone ID.</small><input id="cloudId" type="number" min="1" step="1" placeholder="Model ID"><button id="download">Import original capture / IR</button><p id="message" role="status"></p></section></main>
<script>
const el=id=>document.getElementById(id), keys=["model","second","ir","ir2","slim","slim2","bypass"];let bank=null,draft={},slot="1",busy=false;
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:"POST",headers:{"X-RPiT3K":"1","Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
function say(t){el("message").textContent=t;}
function options(id,files,value){const n=el(id);n.replaceChildren(new Option("None",""),...files.map(f=>new Option(f,f)));if(value&&!files.includes(value))n.add(new Option(value+" (missing)",value));n.value=value||"";}
function render(){if(!bank)return;el("title").textContent="PRESET "+slot;el("slots").replaceChildren(...["1","2","3","4"].map(k=>{const b=document.createElement("button");b.textContent=k;b.className=k===slot?"active":"";b.onclick=()=>{slot=k;render()};return b}));const p=draft[slot];for(const k of ["model","second","ir","ir2"]){options(k,bank.files.filter(f=>k==="model"?/\.nam$/i.test(f):k==="second"?/\.(nam|wav)$/i.test(f):/\.wav$/i.test(f)),p[k]);}for(const k of ["slim","slim2"])el(k).value=p[k];el("bypass").checked=p.bypass;}
for(const k of keys)el(k).onchange=()=>{if(!bank)return;draft[slot][k]=k==="bypass"?el(k).checked:k.startsWith("slim")?Number(el(k).value):el(k).value;if(k==="model"&&el(k).value){draft[slot].bypass=false;el("bypass").checked=false;}};
function changes(){return Object.fromEntries(Object.entries(draft).filter(([k,v])=>keys.some(x=>v[x]!==bank.presets[k][x])).map(([k,v])=>[k,Object.fromEntries(keys.filter(x=>v[x]!==bank.presets[k][x]).map(x=>[x,v[x]]))]));}
async function run(fn){if(busy)return;busy=true;for(const id of ["sync","save","download",...keys])el(id).disabled=true;try{await fn()}catch(e){say(e.message)}finally{busy=false;for(const id of ["sync","save","download",...keys])el(id).disabled=false;}}
async function sync(){bank=await api("/api/companion/bank");draft=JSON.parse(JSON.stringify(bank.presets));render();say("Synced four presets.");}
el("sync").onclick=()=>run(async()=>{if(bank&&Object.keys(changes()).length&&!confirm("Discard unsaved edits?"))return;await sync()});
el("save").onclick=()=>run(async()=>{if(!bank)return;const c=changes();if(!Object.keys(c).length){say("No changes.");return;}bank=await api("/api/companion/bank",{version:1,original:bank.presets,changes:c});draft=JSON.parse(JSON.stringify(bank.presets));render();say("Presets saved. Activate from the main interface.");});
el("download").onclick=()=>run(async()=>{const id=Number(el("cloudId").value);if(!Number.isSafeInteger(id)||id<1)throw Error("Enter a valid model ID");const r=await api("/api/tone3000/download",{model_id:id});const fresh=await api("/api/companion/bank");bank.files=fresh.files;render();say("Imported: "+r.file+" — select it in a chain block.");});
run(sync);
</script></body></html>
